name: Build reviewed Debian package
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install distribution build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build qt6-base-dev qt6-image-formats-plugins libgl1-mesa-dev file dpkg-dev
      - name: Build, test, and package this checkout
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --target all paintdotnet_tests paintdotnet_brush_tests paintdotnet_security_tests -j2
          ctest --test-dir build --output-on-failure
          cpack --config build/CPackConfig.cmake -G DEB -B dist
          dpkg-deb --info dist/*.deb
          (cd dist && sha256sum *.deb > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paint.software-deb-${{ github.sha }}
          path: dist/
          if-no-files-found: error
